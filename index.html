<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HLL Mortar">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>HLL Vietnam Mortar Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171717;
      --panel: #1b1b1b;
      --panel2: #202020;
      --border: #303030;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --dim: #686868;
      --button: #353535;
      --button2: #2a2a2a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .header {
      position: relative;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
      text-align: center;
      padding: 0 44px;
    }

    .gear {
      position: absolute;
      left: 0;
      top: 4px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #c7c7c7;
      font-size: 23px;
      cursor: pointer;
    }

    .gear:active { background: #252525; }

    .settings {
      position: absolute;
      left: 0;
      top: 46px;
      z-index: 20;
      min-width: 145px;
      padding: 6px;
      background: #252525;
      border: 1px solid #3b3b3b;
      border-radius: 9px;
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
    }

    .settings[hidden] { display: none; }

    .settings button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 6px;
      text-align: left;
      background: transparent;
      color: #eee;
      font-size: 14px;
    }

    .settings button.active {
      background: #3a3a3a;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 16px;
    }

    .section-title {
      color: #c2c2c2;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2px;
      margin-bottom: 12px;
    }

    .fire-control .section-title {
      text-align: center;
    }

    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }

    .input-row label {
      color: #c8c8c8;
      font-size: 14px;
    }

    input {
      width: 92px;
      border: 0;
      border-radius: 2px;
      background: #252525;
      color: white;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      padding: 10px 8px;
      outline: none;
    }

    .unit {
      color: #b0b0b0;
      font-size: 14px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 14px 0 8px;
    }

    .actions button {
      border: 0;
      border-radius: 2px;
      padding: 11px 17px;
      color: white;
      background: var(--button);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .actions .save {
      background: var(--button2);
      color: #ddd;
    }

    .angle {
      margin-top: 20px;
      text-align: center;
      font-size: clamp(54px, 11vw, 68px);
      line-height: 1;
      font-weight: 700;
    }

    .instruction {
      min-height: 24px;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .range {
      text-align: center;
      margin-top: 22px;
      color: var(--dim);
      font-size: 11px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .topline .section-title {
      margin: 0;
    }

    .small {
      color: var(--dim);
      font-size: 11px;
    }

    .listbox {
      border: 1px solid var(--border);
      background: var(--panel2);
      overflow: hidden;
    }

    .saved-row, .history-row {
      display: flex;
      align-items: center;
      min-height: 35px;
      border-bottom: 1px solid #2c2c2c;
    }

    .saved-row:last-child, .history-row:last-child { border-bottom: 0; }

    .recall {
      flex: 1;
      border: 0;
      background: transparent;
      color: #eee;
      text-align: left;
      padding: 9px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .remove {
      width: 36px;
      align-self: stretch;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      padding: 9px 10px;
      color: #666;
      font-size: 13px;
    }

    .history-header {
      margin-top: 16px;
    }

    .clear {
      border: 0;
      background: transparent;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 0 4px 8px;
    }

    .history-row button {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body.basic .info-panel,
    body.basic .save {
      display: none !important;
    }

    body.basic .layout {
      display: block;
      max-width: 390px;
      margin: 0 auto;
    }

    @media (max-width: 620px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .angle {
        font-size: 64px;
      }

      body.full .info-panel {
        margin-bottom: 10px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .header { height: 40px; }
      .gear { top: 0; }
      .layout { grid-template-columns: 1fr 1fr; }
      .panel { padding: 12px; }
      .angle { margin-top: 10px; font-size: 50px; }
      .instruction { margin-top: 8px; }
      .range { margin-top: 12px; }
    }
  </style>
</head>
<body class="full">
  <main class="app">
    <header class="header">
      <button class="gear" id="gear" aria-label="Settings">⚙</button>
      <div class="title">HLL: VIETNAM&nbsp; • &nbsp;MORTAR</div>
      <div class="settings" id="settings" hidden>
        <button id="basicMode">Basic</button>
        <button id="fullMode">Full</button>
      </div>
    </header>

    <div class="layout">
      <section class="panel fire-control">
        <div class="section-title">FIRE CONTROL</div>

        <div class="input-row">
          <label for="distance">Target distance</label>
          <input id="distance" inputmode="decimal" autocomplete="off" aria-label="Target distance in meters">
          <span class="unit">m</span>
        </div>

        <div class="actions">
          <button id="calculate">CALCULATE</button>
          <button class="save" id="save">☆ SAVE</button>
        </div>

        <div class="angle" id="angle">—</div>
        <div class="instruction" id="instruction">Enter a target distance</div>
        <div class="range">Valid range: 100–450 m</div>
      </section>

      <section class="panel info-panel">
        <div class="topline">
          <div class="section-title">SAVED DISTANCES</div>
          <div class="small">max 3</div>
        </div>
        <div class="listbox" id="savedList"></div>

        <div class="topline history-header">
          <div class="section-title">LAST 5 TARGETS</div>
          <button class="clear" id="clearHistory">Clear</button>
        </div>
        <div class="listbox" id="historyList"></div>
      </section>
    </div>
  </main>

<script>
const RANGE_TABLE = [
  [100,85],[125,79],[150,73],[175,67],[200,55],[225,49],[250,43],
  [275,36],[300,30],[350,24],[375,18],[400,12],[425,6],[450,0]
];

const $ = (id) => document.getElementById(id);
const distanceInput = $("distance");
const angleEl = $("angle");
const instructionEl = $("instruction");
const savedList = $("savedList");
const historyList = $("historyList");

let currentResult = null;
let favorites = JSON.parse(localStorage.getItem("hll_favorites") || "[]");
let history = JSON.parse(localStorage.getItem("hll_history") || "[]");
let mode = localStorage.getItem("hll_mode") || "Full";

function interpolate(x) {
  if (x < RANGE_TABLE[0][0] || x > RANGE_TABLE[RANGE_TABLE.length - 1][0]) {
    throw new Error("range");
  }

  for (let i = 0; i < RANGE_TABLE.length - 1; i++) {
    const [x1,y1] = RANGE_TABLE[i];
    const [x2,y2] = RANGE_TABLE[i+1];

    if (x === x1) return y1;
    if (x >= x1 && x <= x2) {
      if (x === x2) return y2;
      const ratio = (x - x1) / (x2 - x1);
      return y1 + ratio * (y2 - y1);
    }
  }

  return RANGE_TABLE[RANGE_TABLE.length - 1][1];
}

function formatDistance(value) {
  return Number.isInteger(value) ? String(value) : String(value);
}

function settingInstruction(angle) {
  const lower = Math.floor(angle);
  const upper = Math.ceil(angle);
  const decimal = angle - lower;

  if (Math.abs(decimal) < 0.0001) return `Set mortar to ${lower}°`;
  if (Math.abs(decimal - 0.5) < 0.0001) {
    return `Set mortar halfway between ${lower}° and ${upper}°`;
  }
  if (decimal < 0.5) return `Set mortar just over ${lower}°`;
  return `Set mortar just under ${upper}°`;
}

function showResult(distance, angle) {
  currentResult = { distance, angle };
  distanceInput.value = formatDistance(distance);
  angleEl.textContent = `${angle.toFixed(1)}°`;
  instructionEl.textContent =
    "Note — angle does not account for elevation. If target is lower, increase angle. If target is higher, reduce angle.";
}

function calculate() {
  const value = Number(distanceInput.value.trim());

  if (!Number.isFinite(value)) {
    showError("Enter a number from 100 to 450.");
    return;
  }
  if (value < 100 || value > 450) {
    showError("Mortar range is 100–450 m.");
    return;
  }

  const angle = interpolate(value);
  showResult(value, angle);
  addHistory(value, angle);

  distanceInput.select();
}

function showError(message) {
  currentResult = null;
  angleEl.textContent = "—";
  instructionEl.textContent = message;
  distanceInput.select();
}

function addHistory(distance, angle) {
  history = history.filter(x => Math.abs(x.distance - distance) > 0.0001);
  history.unshift({ distance, angle });
  history = history.slice(0, 5);
  localStorage.setItem("hll_history", JSON.stringify(history));
  renderHistory();
}

function saveCurrent() {
  if (!currentResult || favorites.length >= 3) return;
  if (favorites.some(x => Math.abs(x.distance - currentResult.distance) < 0.0001)) return;

  favorites.push(currentResult);
  localStorage.setItem("hll_favorites", JSON.stringify(favorites));
  renderFavorites();
}

function recall(distance) {
  const angle = interpolate(distance);
  showResult(distance, angle);
  addHistory(distance, angle);
}

function renderFavorites() {
  savedList.innerHTML = "";

  for (let i = 0; i < 3; i++) {
    if (i < favorites.length) {
      const item = favorites[i];
      const row = document.createElement("div");
      row.className = "saved-row";

      const btn = document.createElement("button");
      btn.className = "recall";
      btn.textContent = `• ${formatDistance(item.distance)} m - ${item.angle.toFixed(1)}°`;
      btn.onclick = () => recall(item.distance);

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "Remove saved distance");
      remove.onclick = () => {
        favorites.splice(i, 1);
        localStorage.setItem("hll_favorites", JSON.stringify(favorites));
        renderFavorites();
      };

      row.append(btn, remove);
      savedList.appendChild(row);
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "• empty";
      savedList.appendChild(empty);
    }
  }
}

function renderHistory() {
  historyList.innerHTML = "";

  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No previous targets yet";
    historyList.appendChild(empty);
    return;
  }

  history.forEach(item => {
    const row = document.createElement("div");
    row.className = "history-row";

    const btn = document.createElement("button");
    btn.className = "recall";
    btn.textContent = `${formatDistance(item.distance).padStart(5)} m    ${item.angle.toFixed(1)}°`;
    btn.onclick = () => recall(item.distance);

    row.appendChild(btn);
    historyList.appendChild(row);
  });
}

function applyMode(newMode) {
  mode = newMode;
  localStorage.setItem("hll_mode", mode);
  document.body.classList.toggle("basic", mode === "Basic");
  document.body.classList.toggle("full", mode === "Full");
  $("basicMode").classList.toggle("active", mode === "Basic");
  $("fullMode").classList.toggle("active", mode === "Full");
  $("settings").hidden = true;
}

$("calculate").onclick = calculate;
$("save").onclick = saveCurrent;
$("clearHistory").onclick = () => {
  history = [];
  localStorage.setItem("hll_history", "[]");
  renderHistory();
};

distanceInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") calculate();
});

$("gear").onclick = (e) => {
  e.stopPropagation();
  $("settings").hidden = !$("settings").hidden;
};

$("basicMode").onclick = () => applyMode("Basic");
$("fullMode").onclick = () => applyMode("Full");

document.addEventListener("click", (e) => {
  if (!$("settings").contains(e.target) && e.target !== $("gear")) {
    $("settings").hidden = true;
  }
});

renderFavorites();
renderHistory();
applyMode(mode);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
